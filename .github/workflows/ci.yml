name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # Un push nuevo a un PR cancela la corrida anterior (ahorra minutos de Actions).
  # En push a la rama default NO se cancela: cada merge conserva su CI.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist/ matches committed build
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ está desactualizado respecto al build fresco. Corre 'npm run build' y commitea el resultado antes de publicar/taguear."
            git diff --stat -- dist
            exit 1
          fi
